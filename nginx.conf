server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP source lists cover this app's real origins:
    # Google Fonts, cdnjs + jsDelivr (Font Awesome / libs), Supabase Storage and
    # https images for the gallery/boards, and YouTube/Docs/Meet iframes.
    #
    # script-src: does NOT allow 'unsafe-inline' — the single inline script
    # (the theme-flash IIFE in index.html) is allowlisted by its sha256 hash, so
    # no other inline script can run. If that IIFE is edited, recompute the hash.
    # 'unsafe-eval' is still required: the tldraw bundle uses Function(); there is
    # no WebAssembly, so 'wasm-unsafe-eval' would not suffice.
    # style-src keeps 'unsafe-inline' because motion/CSS-in-JS inject per-render
    # inline styles that can't be hashed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-tesIyH7vLMTFjtxXikq0Hq2RnWJtYMUMUIi2wN61eiQ=' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src https://www.youtube.com https://youtube.com https://docs.google.com https://meet.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all non-asset, non-api routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
