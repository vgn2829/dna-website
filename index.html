<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IITK DnA Club — Design &amp; Animation</title>
    <meta name="description" content="The Design and Animation Club of IIT Kanpur — creative learning, masterclass workshops, and curated artwork gallery." />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />

    <!-- Google Fonts: Mona Sans (GT Walsheim substitute) + Inter Variable -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome — domain icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dna-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.background = t === 'light' ? '#ffffff' : '#111110';
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.background = '#111110';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
