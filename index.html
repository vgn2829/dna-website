<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="HeLSN2kE-YVEX4XU-gMtMGijZZcTISDtOJY31jCrK40" />
    <title>DnA Club | Design &amp; Animation Club, IIT Kanpur</title>
    <meta name="description" content="The Design &amp; Animation Club of IIT Kanpur — a creative community from UI/UX to 3D animation. Explore the artwork gallery, events, the Academy, and free design tools." />
    <link rel="canonical" href="https://www.dnaiitk.site/" />

    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png?v=2" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DnA Club, IIT Kanpur" />
    <meta property="og:url" content="https://www.dnaiitk.site/" />
    <meta property="og:title" content="DnA Club | Design &amp; Animation Club, IIT Kanpur" />
    <meta property="og:description" content="The Design &amp; Animation Club of IIT Kanpur — a creative community from UI/UX to 3D animation. Explore the artwork gallery, events, the Academy, and free design tools." />
    <meta property="og:image" content="https://www.dnaiitk.site/logo.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DnA Club | Design &amp; Animation Club, IIT Kanpur" />
    <meta name="twitter:description" content="The Design &amp; Animation Club of IIT Kanpur — a creative community from UI/UX to 3D animation. Explore the artwork gallery, events, the Academy, and free design tools." />
    <meta name="twitter:image" content="https://www.dnaiitk.site/logo.png" />

    <!-- Structured data: Organization + WebSite (sitewide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.dnaiitk.site/#organization",
            "name": "Design and Animation Club, IIT Kanpur",
            "url": "https://www.dnaiitk.site",
            "logo": "https://www.dnaiitk.site/logo.png",
            "sameAs": [
              "https://www.instagram.com/dnaiitk/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.dnaiitk.site/#website",
            "name": "DnA Club, IIT Kanpur",
            "url": "https://www.dnaiitk.site",
            "publisher": { "@id": "https://www.dnaiitk.site/#organization" }
          }
        ]
      }
    </script>

    <!-- Google Fonts: Mona Sans (GT Walsheim substitute) + Inter Variable -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dna-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.background = t === 'light' ? '#ffffff' : '#111110';
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.background = '#111110';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
